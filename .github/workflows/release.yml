name: Release

# Publishing flow: push a version tag (e.g. `git tag v0.2.0 && git push origin
# v0.2.0`) and nothing else. This workflow tests, publishes to crates.io via
# OIDC trusted publishing (no long-lived token anywhere), and only after the
# crate is live moves the major tag (v0) and creates the GitHub release — so a
# consumer of the action never resolves a tag whose crate version does not
# exist yet.
#
# One-time setup on crates.io (Settings → Trusted Publishing on the crate):
#   repository owner: SiliconState
#   repository name:  change-capsule
#   workflow file:    release.yml
#   environment:      (leave blank)

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Tag must match the crate version
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "v${crate_version}" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match crate version ${crate_version}" >&2
            exit 1
          fi

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move the major tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_REF_NAME"
          git push -f origin "$major"
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Capsule ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
