[package]
name = "change-capsule"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Isolated Git worktree attempts for coding agents, sealed into portable verifiable receipts"
license = "MIT"
readme = "README.md"
repository = "https://github.com/SiliconState/change-capsule"
homepage = "https://github.com/SiliconState/change-capsule"
documentation = "https://docs.rs/change-capsule"
exclude = ["receipts/"]
keywords = ["agents", "git", "worktree", "automation", "provenance"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[lib]
name = "change_capsule"
path = "src/lib.rs"

[[bin]]
name = "capsule"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"], optional = true }
fs2 = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
ulid = "1"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
# Warn rather than deny: this applies when consumers compile the crate, and a
# future compiler widening the lint must not break their builds. CI promotes it
# to an error via `cargo clippy -- -D warnings`.
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
